<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crazybaby – Futuristic Wireless Speaker Luna</title>
    <meta
      name="description"
      content="Luna by Crazybaby – a futuristic wireless speaker with balanced sound, intuitive lighting system, and multi-room Wi-Fi support."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="apple-touch-icon"
      type="image/png"
      sizes="180x180"
      href="./images/favicon/favicon-180x180.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon/favicon-32x32.png"
    />

    <link rel="stylesheet" href="./styles/main.scss" />
    <script src="scripts/main.js" defer></script>
  </head>

  <body>
    <header class="header">
      <div class="header__container">
        <a href="#" class="header__logo-link">
          <img
            src="./images/logo.svg"
            alt="Crazybaby logo"
            class="header__logo"
          />
        </a>

        <div class="header__wrapper">
          <nav class="header__navigation">
            <ul class="header__list">
              <li class="header__item">
                <a href="#specs" class="header__specs-link"> Specs </a>
              </li>

              <li class="header__item">
                <div class="header__languages">
                  <a href="#en" class="language-switch">EN </a>
                  <span class="language-divider">/</span>
                  <a href="#ua" class="language-switch">UA</a>
                </div>
              </li>
            </ul>
          </nav>

          <button type="button" class="header__buy-button">Buy</button>
        </div>

        <a href="#menu" class="header__menu-button icon icon--menu"></a>
      </div>
    </header>

    <aside class="menu" id="menu">
      <div class="menu__header">
        <a href="#" class="menu__logo-link">
          <img
            src="./images/logo.svg"
            alt="Crazybaby logo"
            class="menu__logo"
          />
        </a>

        <a
          href="#"
          class="menu__close-button icon icon--close"
          aria-label="Close navigation menu"
        ></a>
      </div>

      <nav class="menu__nav" aria-label="Mobile menu links">
        <ul class="menu__nav-list">
          <li class="menu__nav-item">
            <a class="menu__nav-link menu__nav-link--active" href="#our-story">
              Our Story
            </a>
          </li>
          <li class="menu__nav-item">
            <a class="menu__nav-link" href="#about-us">About Us</a>
          </li>
          <li class="menu__nav-item">
            <a class="menu__nav-link" href="#features">Features</a>
          </li>
          <li class="menu__nav-item">
            <a class="menu__nav-link" href="#get-in-touch">Get in Touch</a>
          </li>
        </ul>
      </nav>

      <div class="menu__bottom">
        <a href="#specs" class="menu__specs-link">Specs</a>

        <div class="menu__languages language-switcher">
          <a href="#en" class="language-switch"> EN </a>
          <span class="language-divider">/</span>
          <a href="#ua" class="language-switch">UA</a>
        </div>
      </div>

      <a href="#get-in-touch" class="menu__buy-button">Buy</a>
    </aside>

    <main>
      <section class="promo" id="our-story">
        <div class="promo__container">
          <div class="promo__image-wrapper">
            <picture>
              <source
                media="(min-width: 1194px)"
                srcset="./images/product/luna-product-pair-lg.webp"
                type="image/webp"
              />
              <source
                media="(min-width: 1194px)"
                srcset="./images/product/luna-product-pair-lg.png"
              />
              <source
                media="(min-width: 768px)"
                srcset="./images/product/luna-product-pair-md.webp"
                type="image/webp"
              />
              <source
                media="(min-width: 768px)"
                srcset="./images/product/luna-product-pair-md.png"
              />
              <source
                srcset="./images/product/luna-product-pair-sm.webp"
                type="image/webp"
              />
              <img
                src="./images/product/luna-product-pair-sm.png"
                alt="Luna wireless speaker"
                class="promo__image"
              />
            </picture>
          </div>
          <div class="promo__content">
            <h1 class="promo__title">Futuristic Wireless Speaker</h1>
            <p class="promo__description">
              Luna’s performance is balanced and smooth in all frequency ranges
              which makes the music both naturally pleasant and distinctly more
              layered.
            </p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
