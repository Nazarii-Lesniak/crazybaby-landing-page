<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crazybaby</title>

    <link rel="preconnect" href="https://googleapis.com" />
    <link 
      rel="preconnect" 
      href="https://gstatic.com" 
      crossorigin="anonymous" 
    />
    <link
      href="https://googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="apple-touch-icon"
      type="image/png"
      sizes="180x180"
      href="./images/favicon/favicon-180x180.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon/favicon-32x32.png"
    />

    <link rel="stylesheet" href="./styles/main.scss" />
    <script src="scripts/main.js" defer></script>
  </head>

  <body>
    <header class="header">
      <div class="header__container">
        <a href="#" class="header__link">
          <img
            src="./images/logo.svg"
            alt="Crazybaby logo"
            class="header__logo"
          />
        </a>

        <div class="header__wrapper">
          <nav class="header__navigation">
            <ul class="header__list">
              <li class="header__list-item">
                <a href="#specs" class="header__list-link">Specs</a>
              </li>
              <li class="header__list-item">
                <a
                  href="#en"
                  class="header__language-switch"
                  aria-current="page"
                >
                  EN
                </a>

                <span class="header__language-divider">/</span>
                <a href="#ua" class="header__language-switch">UA</a>
              </li>
            </ul>
          </nav>
          <button
            type="button"
            class="header__buy-button"
            aria-expanded="false"
          >
            Buy
          </button>
        </div>

        <button
          type="button"
          class="header__menu-button icon icon--menu"
          aria-expanded="false"
          aria-label="Toggle navigation menu"
        ></button>
      </div>
    </header>
    <aside></aside>
    <main>
      <section>Futuristic Design</section>
      <section>Product Gallery</section>
      <section>Designed for the Future</section>
      <section>Luna Eye</section>
      <section>Testimonial Section</section>
      <section>Features</section>
      <section>Contact Form?</section>
      <section></section>
    </main>
    <footer></footer>
  </body>
</html>
